<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192f2a">
  <meta name="description" content="关羽单关竖屏塔防：布阵聚敌，蓄怒，一刀破阵。">
  <title>无双守关 · 关羽试炼</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="game-shell" aria-label="无双守关，关羽单关原型">
    <header class="brand-row">
      <div class="brand"><span class="brand-seal" aria-hidden="true">关</span><div><h1>无双守关</h1><span class="chapter">关羽 · 孤城试炼</span></div></div>
      <div class="header-actions">
        <button class="icon-button" id="sound-button" type="button" aria-label="关闭声音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 8c3 2 3 6 0 8M19 5c5 4 5 10 0 14"/></svg></button>
        <button class="icon-button" id="pause-button" type="button" aria-label="暂停战斗" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      </div>
    </header>

    <section class="battle-hud" aria-label="战斗信息">
      <div class="castle-stat"><div class="stat-top"><span>城关</span><span id="hp-value">100 / 100</span></div><div class="castle-meter" role="progressbar" aria-label="城关耐久" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="hp-fill"></span></div></div>
      <div class="food-stat"><span class="small-label">军粮</span><strong id="food-value">120</strong></div>
      <div class="wave-stat"><span class="small-label" id="wave-label">准备迎战</span><strong id="time-value">00:00</strong></div>
    </section>

    <section class="battlefield" aria-label="守关战场">
      <canvas id="battle-canvas" aria-label="双路敌军进攻城关；点击营位部署军阵。军阵也可以通过下方的布阵按钮选择。" role="img"></canvas>
      <div class="field-vignette" aria-hidden="true"></div>
      <div class="wave-banner" id="wave-banner" aria-hidden="true"></div>
      <div class="burst-number" id="burst-number" aria-hidden="true"></div>
      <div class="field-hint" id="field-hint">盾营拦敌 · 弓营迎击</div>

      <section class="screen-overlay intro-overlay" id="intro-overlay" aria-label="开始试炼">
        <div class="intro-kicker">三国 · 城关试炼</div>
        <div class="intro-seal" aria-hidden="true">武圣</div>
        <h2>一刀，破千军。</h2>
        <p>以军阵聚敌，以无双破阵。</p>
        <div class="intro-steps"><span>布阵</span><i>→</i><span>蓄怒</span><i>→</i><span>横扫</span></div>
        <button class="primary-button" id="start-button" type="button">出阵守关 <span aria-hidden="true">↗</span></button>
        <span class="intro-note">单手点按 · 一局约 4 分钟</span>
      </section>

      <section class="screen-overlay" id="pause-overlay" aria-label="战斗已暂停" hidden>
        <div class="overlay-kicker">暂歇片刻</div><h2>战斗暂停</h2><p>防线与怒气都停在这一刻。</p>
        <button class="primary-button" id="resume-button" type="button">继续守关</button>
        <button class="secondary-button" id="restart-paused" type="button">重新挑战</button>
      </section>

      <section class="screen-overlay choice-overlay" id="choice-overlay" aria-label="选择战术强化" hidden>
        <div class="overlay-kicker">整军备战</div><h2>选一项战术</h2><p>战斗已暂停，强化后迎接下一波。</p>
        <div id="upgrade-choices" class="upgrade-choices"></div>
      </section>

      <section class="screen-overlay result-overlay" id="result-overlay" aria-label="战斗结果" hidden>
        <div class="overlay-kicker" id="result-kicker">孤城试炼</div><h2 id="result-title">城关守住了</h2><p id="result-copy">这一刀，值得再来一次。</p>
        <div class="result-stats"><div><span>总击破</span><strong id="result-kills">0</strong></div><div><span>最佳横扫</span><strong id="result-burst">0</strong></div><div><span>无双次数</span><strong id="result-casts">0</strong></div></div>
        <button class="primary-button" id="retry-button" type="button">再战一局 <span aria-hidden="true">↗</span></button>
        <span class="record-note" id="record-note"></span>
      </section>

      <section class="camp-panel" id="camp-panel" aria-label="军阵部署与升级" hidden>
        <div class="camp-panel-heading"><div><span class="overlay-kicker" id="camp-index-label">营位一</span><h3 id="camp-title">部署军阵</h3></div><button class="close-button" id="close-camp" type="button" aria-label="关闭布阵，继续战斗">×</button></div>
        <div id="camp-options" class="camp-options"></div>
        <div class="tactical-note">布阵时战斗暂停 · 关闭后继续</div>
      </section>
    </section>

    <footer class="command-bar">
      <div class="command-caption"><button type="button" id="formation-button" class="formation-button">布阵 <span aria-hidden="true">＋</span></button><span id="command-hint">怒气就绪后，点按主将横扫敌军</span></div>
      <button id="ultimate-button" class="ultimate-button" type="button" disabled aria-label="关羽武圣无双，怒气不足">
        <span class="rage-fill" id="rage-fill" aria-hidden="true"></span>
        <span class="ultimate-mark" aria-hidden="true">斩</span>
        <span class="ultimate-name"><strong>武圣 · 无双横扫</strong><small id="rage-label">蓄怒 40 / 100</small></span>
        <span id="ultimate-state" class="ultimate-state">蓄势</span>
      </button>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="fatal-message" id="fatal-message" role="alert" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
